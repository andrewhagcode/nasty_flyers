name: Update setlists from Google Sheet

# Runs every night, and whenever you press "Run workflow" on the Actions tab
# (use that right after a show if you don't want to wait).
on:
  schedule:
    # GitHub's cron is best-effort - runs get delayed or dropped under load,
    # and jobs landing on the hour are queued worst. So: odd minutes, and
    # four chances a day. Each run takes ~15s and only commits if the
    # spreadsheet actually changed, so extra runs cost essentially nothing.
    - cron: "23 9 * * *"     # ~3:23am Mountain / 5:23am Eastern
    - cron: "23 15 * * *"    # ~9:23am Mountain / 11:23am Eastern
    - cron: "23 21 * * *"    # ~3:23pm Mountain / 5:23pm Eastern
    - cron: "23 3 * * *"     # ~9:23pm Mountain / 11:23pm Eastern
  workflow_dispatch:

permissions:
  contents: write

# never let two runs fight over the same commit
concurrency:
  group: setlists
  cancel-in-progress: false

jobs:
  setlists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Rebuild the setlist archive
        run: python3 scripts/build_setlists.py --debug

      - name: Save the fetched sheet (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-debug
          path: debug-sheet.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit if anything changed
        run: |
          if [[ -z "$(git status --porcelain index.html)" ]]; then
            echo "No setlist changes - index.html already matches the sheet."
            echo "(This is normal. A run with no commit means nothing changed.)"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update setlists from spreadsheet"

          # If anyone pushes to main while this job is running, our push is
          # rejected as non-fast-forward. Rebase onto whatever landed and
          # retry rather than failing the run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - syncing with remote and retrying..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              echo "Rebase failed - stopping so nothing is clobbered."
              exit 1
            }
            sleep $((attempt * 3))
          done
          echo "Still could not push after 5 attempts."
          exit 1
